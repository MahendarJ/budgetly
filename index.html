<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budgetly">
<title>Budgetly</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title">Budgetly</h1>
    </div>
    <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings">⚙︎</button>
  </header>
  <div class="month-nav" id="month-nav">
    <button type="button" class="icon-btn sm" data-act="month" data-d="-1" aria-label="Previous month">‹</button>
    <button type="button" class="month-label" id="month-label" data-act="month-today"></button>
    <button type="button" class="icon-btn sm" data-act="month" data-d="1" aria-label="Next month">›</button>
  </div>
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="Main">
  <button class="tb" data-tab="home" type="button"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="tb" data-tab="activity" type="button"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Activity</button>
  <button class="fab" id="add-btn" type="button" aria-label="Add transaction">+</button>
  <button class="tb" data-tab="budgets" type="button"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Budgets</button>
  <button class="tb" data-tab="insights" type="button"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
</nav>

<div id="sheet-root"></div>
<div class="toast hidden" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
